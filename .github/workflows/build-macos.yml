name: Build macOS app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel   # Intel Macs
            arch: intel
          - runner: macos-latest     # Apple Silicon
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      ZIP: SeratoYouTube-macOS-${{ matrix.arch }}.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pillow

      - name: Build SeratoYouTube.app
        # Pillow lets PyInstaller convert the .ico into the .icns macOS needs.
        run: |
          pyinstaller --noconfirm --windowed --name SeratoYouTube \
            --icon serato_youtube.ico \
            --osx-bundle-identifier com.seratoyoutube.overlay \
            --collect-data imageio_ffmpeg \
            app.py

      - name: Check architecture
        run: file dist/SeratoYouTube.app/Contents/MacOS/SeratoYouTube

      - name: Zip (ditto keeps the bundle's symlinks and permissions)
        run: ditto -c -k --keepParent dist/SeratoYouTube.app "$ZIP"

      - uses: actions/upload-artifact@v4
        with:
          name: SeratoYouTube-macOS-${{ matrix.arch }}
          path: ${{ env.ZIP }}

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" --generate-notes || gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
