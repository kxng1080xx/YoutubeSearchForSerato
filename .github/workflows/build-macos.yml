name: Build macOS app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Apple Silicon. For Intel Macs add an Intel runner to a matrix.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pillow

      - name: Build SeratoYouTube.app
        # Pillow lets PyInstaller convert the .ico into the .icns macOS needs.
        run: |
          pyinstaller --noconfirm --windowed --name SeratoYouTube \
            --icon serato_youtube.ico \
            --osx-bundle-identifier com.seratoyoutube.overlay \
            --collect-data imageio_ffmpeg \
            app.py

      - name: Zip (ditto keeps the bundle's symlinks and permissions)
        run: ditto -c -k --keepParent dist/SeratoYouTube.app SeratoYouTube-macOS-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SeratoYouTube-macOS-arm64
          path: SeratoYouTube-macOS-arm64.zip

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" SeratoYouTube-macOS-arm64.zip --generate-notes || gh release upload "$GITHUB_REF_NAME" SeratoYouTube-macOS-arm64.zip --clobber
